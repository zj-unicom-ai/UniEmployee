services:
  uniemployee:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: uniemployee:latest
    container_name: uniemployee
    ports:
      - "8787:8787"
    environment:
      # 仅放非密钥的运行参数；密钥（OPENAI_API_KEY / JWT_SECRET 等）全部来自下方 env_file: .env
      - APP_DATA_DIR=/app/data
      - PORT=8787
      - LOG_LEVEL=INFO
    env_file:
      # .env 里已含 OPENAI_API_KEY / OPENAI_BASE_URL / MODEL_NAME / JWT_SECRET，
      # 由 env_file 注入容器（.env 不进镜像、不提交仓库）。
      - .env
    volumes:
      # SQLite 库持久化
      - ./data/db:/app/data
      # 后端技能目录
      - ./backend/skills:/app/backend/skills
      # 用户上传的自定义技能持久化
      - ./backend/skills-custom:/app/backend/skills-custom
      # 数据分析看板持久化
      - ./workspace:/app/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
