[project]
name = "uniemployee"
version = "0.5.0"
description = "UniEmployee 数字员工平台——基于 deepagents 的多租户数字员工运行平台"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "ZJ-Unicom-AI" },
]

dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.11.10",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "PyJWT==2.13.0",
    "bcrypt==5.0.0",
    "deepagents==0.7.5",
    "langchain-deepseek==1.1.0",
    "langgraph==1.2.9",
    "langgraph-checkpoint-sqlite==3.1.0",
    "langchain-mcp-adapters==0.3.0",
    "langchain-openai==1.4.1",
    "fastmcp==3.4.4",
    "httpx==0.28.1",
    "tzdata==2025.2",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 标记慢测试（如真实联网/浏览器）"]
addopts = "-q"
